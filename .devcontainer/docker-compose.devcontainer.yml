services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "8787"
      DATABASE_URL: postgres://systemfabric:systemfabric_dev@postgres:5432/systemfabric
      TEST_DATABASE_URL: postgres://systemfabric:systemfabric_dev@postgres:5432/systemfabric_test
      MEMGRAPH_URL: bolt://memgraph:7687
      MEMGRAPH_TEST_URL: bolt://memgraph:7687
      AI_PROVIDER: mock
      AI_ALLOWED_PROVIDERS: mock
      AI_ALLOW_EXTERNAL_CONTENT: "false"
      SYSTEMFABRIC_MAIL_PROVIDER: disabled
      SF_DEVCONTAINER: "true"
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: systemfabric_minio
      AWS_SECRET_ACCESS_KEY: systemfabric_minio_dev_only
      S3_BUCKET: systemfabric-assets
    volumes:
      - .:/workspace:cached
      - systemfabric-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_started
    init: true

volumes:
  systemfabric-node-modules:
