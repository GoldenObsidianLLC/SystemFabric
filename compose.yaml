# LOCAL DEVELOPMENT / TEST SERVICES ONLY. Do not deploy this file as production.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: systemfabric
      POSTGRES_USER: systemfabric
      POSTGRES_PASSWORD: systemfabric_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - systemfabric-postgres:/var/lib/postgresql
      - ./docker/postgres/init/01-create-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemfabric -d systemfabric"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7444:7444"
    volumes:
      - systemfabric-memgraph:/var/lib/memgraph
    restart: unless-stopped

  # Optional S3-compatible storage test fixture. Start with: docker compose --profile cloud up -d
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["cloud"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: systemfabric_minio
      MINIO_ROOT_PASSWORD: systemfabric_minio_dev_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - systemfabric-minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["cloud"]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/systemfabric-assets
    environment:
      MINIO_ROOT_USER: systemfabric_minio
      MINIO_ROOT_PASSWORD: systemfabric_minio_dev_only
    restart: "no"

  # The VS Code container has the clamdscan client; this service supplies clamd.
  # Start with: docker compose --profile malware up -d clamav
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["malware"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - systemfabric-clamav-db:/var/lib/clamav
    restart: unless-stopped

volumes:
  systemfabric-postgres:
  systemfabric-memgraph:
  systemfabric-minio:
  systemfabric-clamav-db:
