# LOCAL DEVELOPMENT / TEST SERVICES ONLY. Do not deploy this file as production.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: virgoscorpio_hub
      POSTGRES_USER: virgoscorpio_hub
      POSTGRES_PASSWORD: virgoscorpio_hub_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - virgoscorpio_hub-postgres:/var/lib/postgresql
      - ./docker/postgres/init/01-create-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virgoscorpio_hub -d virgoscorpio_hub"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7444:7444"
    volumes:
      - virgoscorpio_hub-memgraph:/var/lib/memgraph
    restart: unless-stopped

  # Optional S3-compatible storage test fixture. Start with: docker compose --profile cloud up -d
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["cloud"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: virgoscorpio_hub_minio
      MINIO_ROOT_PASSWORD: virgoscorpio_hub_minio_dev_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - virgoscorpio_hub-minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["cloud"]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/virgoscorpio-hub-assets
    environment:
      MINIO_ROOT_USER: virgoscorpio_hub_minio
      MINIO_ROOT_PASSWORD: virgoscorpio_hub_minio_dev_only
    restart: "no"

  # The VS Code container has the clamdscan client; this service supplies clamd.
  # Start with: docker compose --profile malware up -d clamav
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["malware"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - virgoscorpio_hub-clamav-db:/var/lib/clamav
    restart: unless-stopped

  # Local-only, authenticated OTLP/HTTP collector. Debug exporter is ephemeral.
  # Configure the shared token first: npm run otel:dev:setup
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:${VIRGOSCORPIO_HUB_OTEL_COLLECTOR_IMAGE_TAG:-0.164.0-amd64}
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./docker/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    secrets:
      - otel_receiver_token
    restart: unless-stopped

volumes:
  virgoscorpio_hub-postgres:
  virgoscorpio_hub-memgraph:
  virgoscorpio_hub-minio:
  virgoscorpio_hub-clamav-db:

secrets:
  otel_receiver_token:
    file: ${VIRGOSCORPIO_HUB_OTEL_AUTH_TOKEN_FILE:-./var/secrets/otel-collector-token.txt}
