name: Feature request
description: Propose a focused improvement to SystemFabric.
title: "feature: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: compatibility
    attributes:
      label: Security, compatibility, and operational impact
      description: Consider tenant isolation, data migration, external services, limits, and rollback.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Pre-submission checks
      options:
        - label: This request contains no credentials or private user data.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
