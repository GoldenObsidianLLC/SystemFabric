name: SystemFabric CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemfabric-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-security-and-dependencies:
    name: Unit, security, and dependency checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.4", "24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install exact reviewed dependency graph (requires committed package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize optional local assets
        run: npm run postinstall
      - name: Syntax, artifact, and unit tests
        run: npm run check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - name: Generate fail-closed release-readiness snapshot
        run: npm run release:readiness
      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemfabric-dependency-evidence-node-${{ matrix.node-version }}
          path: |
            artifacts/systemfabric.sbom.cdx.json
            artifacts/release-readiness.json
            artifacts/release-readiness.md
            artifacts/evidence/*.log
            package-lock.json
          if-no-files-found: error

  postgres-memgraph-integration:
    name: PostgreSQL and Memgraph integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: systemfabric
          POSTGRES_USER: systemfabric
          POSTGRES_PASSWORD: systemfabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U systemfabric -d systemfabric"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      memgraph:
        image: memgraph/memgraph:3.13.1
        ports:
          - 7687:7687
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://systemfabric:systemfabric_test@127.0.0.1:5432/systemfabric
      TEST_DATABASE_URL: postgres://systemfabric:systemfabric_test@127.0.0.1:5432/systemfabric_test
      MEMGRAPH_URL: bolt://127.0.0.1:7687
      MEMGRAPH_TEST_URL: bolt://127.0.0.1:7687
      MEMGRAPH_TEST_STATIC_PORT: "true"
      SYSTEMFABRIC_PRESENCE_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install exact reviewed dependency graph (requires committed package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create isolated integration database
        env:
          PGPASSWORD: systemfabric_test
        run: psql -h 127.0.0.1 -U systemfabric -d systemfabric -v ON_ERROR_STOP=1 -c "CREATE DATABASE systemfabric_test;"
      - name: Wait for Memgraph Bolt listener
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7687' 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Memgraph did not become ready on Bolt port 7687.' >&2
          exit 1
      - name: Identify the exact Memgraph test container
        shell: bash
        run: |
          mapfile -t ids < <(
            docker ps \
              --filter 'ancestor=memgraph/memgraph:3.13.1' \
              --format '{{.ID}}'
          )

          if [ "${#ids[@]}" -ne 1 ]; then
            echo "Expected exactly one Memgraph service container; found ${#ids[@]}." >&2
            docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
            exit 1
          fi

          image="$(docker inspect --format '{{.Config.Image}}' "${ids[0]}")"

          if [ "$image" != 'memgraph/memgraph:3.13.1' ]; then
            echo "Unexpected Memgraph test image: $image" >&2
            exit 1
          fi

          echo "MEMGRAPH_TEST_CONTAINER_ID=${ids[0]}" >> "$GITHUB_ENV"
      - name: Apply all migrations to a disposable fresh PostgreSQL database and verify idempotency
        run: npm run test:migrations:fresh
      - name: Test PostgreSQL/Memgraph/community/commerce integration workflows (zero skips required)
        run: npm run test:integration:live
      - name: Exercise real Memgraph outage and outbox recovery
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          npm run test:integration:memgraph-outage 2>&1 | tee artifacts/evidence/memgraph-outage-live.log
      - name: Validate canonical graph rebuild in an isolated Memgraph container
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          npm run test:graph:rebuild 2>&1 | tee artifacts/evidence/graph-rebuild-live.log
      - name: Upload live integration test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemfabric-live-integration-node-22.23.4
          path: |
            artifacts/evidence/integration-tests.tap.log
            artifacts/evidence/integration-migrations.log
            artifacts/evidence/integration-live.json
            artifacts/evidence/fresh-migrations.json
            artifacts/evidence/fresh-migrations.log
            artifacts/evidence/memgraph-outage-live.log
            artifacts/evidence/graph-rebuild-live.log
          if-no-files-found: warn

  browser-and-accessibility:
    name: Browser editor and accessibility smoke tests
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SYSTEMFABRIC_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install exact reviewed dependency graph (requires committed package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Materialize optional local assets
        run: npm run postinstall
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise visual editor and accessibility smoke tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemfabric-playwright-report
          path: test-results/
          if-no-files-found: ignore

  security-static-analysis:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended
          packs: codeql/javascript-queries:AlertSuppression.ql
      - name: Analyze and upload CodeQL results
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
          output: sarif-results
      - name: Verify in-source CodeQL suppressions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_files = list(Path("sarif-results").rglob("*.sarif"))
          if len(sarif_files) != 1:
              raise SystemExit(f"Expected one JavaScript SARIF file; found {len(sarif_files)}.")

          sarif = json.loads(sarif_files[0].read_text(encoding="utf-8"))
          results = [
              result
              for run in sarif.get("runs", [])
              for result in run.get("results", [])
              if result.get("ruleId") == "js/clear-text-storage-of-sensitive-data"
          ]
          suppressed = [
              result
              for result in results
              if any(item.get("kind") == "IN_SOURCE" for item in result.get("suppressions", []))
          ]
          summary = (
              f"CodeQL cookie-flow suppressions: {len(suppressed)} of {len(results)} "
              "results are explicitly annotated in source.\n"
          )
          print(summary.strip())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(summary)

          if len(suppressed) != len(results) or len(suppressed) < 4:
              raise SystemExit("Unexpected unsuppressed cookie-storage finding; review the source and SARIF before dismissal.")
          PY
      # The source-level comments are included in SARIF as IN_SOURCE
      # suppressions. Dismissal is applied only on a push to the default branch,
      # because GitHub alert state is repository-wide, not PR-scoped.
      - name: Dismiss reviewed in-source CodeQL suppressions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ github.token }}
